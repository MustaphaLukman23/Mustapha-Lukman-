<svg width="650" height="600" viewBox="0 0 650 600" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Code editor window">
  <defs>
    <linearGradient id="ed-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8F70"/>
      <stop offset="1" stop-color="#FF3D54"/>
    </linearGradient>
    <filter id="ed-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="30" stdDeviation="35" flood-color="#1F3F5C" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Editor window -->
  <g filter="url(#ed-shadow)">
    <rect x="120" y="70" width="460" height="430" rx="18" fill="#FFFFFF"/>
    <!-- title bar -->
    <rect x="120" y="70" width="460" height="46" rx="18" fill="#F4F6FB"/>
    <rect x="120" y="98" width="460" height="18" fill="#F4F6FB"/>
    <circle cx="148" cy="93" r="7" fill="#FF6F71"/>
    <circle cx="172" cy="93" r="7" fill="#FFC542"/>
    <circle cx="196" cy="93" r="7" fill="#3DD68C"/>

    <!-- gutter line numbers -->
    <g fill="#C7D0DC" font-family="monospace" font-size="13">
      <text x="142" y="150">1</text>
      <text x="142" y="178">2</text>
      <text x="142" y="206">3</text>
      <text x="142" y="234">4</text>
      <text x="142" y="262">5</text>
      <text x="142" y="290">6</text>
      <text x="142" y="318">7</text>
      <text x="142" y="346">8</text>
      <text x="142" y="374">9</text>
      <text x="138" y="402">10</text>
      <text x="138" y="430">11</text>
      <text x="138" y="458">12</text>
    </g>

    <!-- code lines (colored bars) -->
    <g rx="4">
      <rect x="172" y="140" width="120" height="11" rx="5" fill="#FFB1A8"/>
      <rect x="300" y="140" width="70" height="11" rx="5" fill="#9AA8BD"/>

      <rect x="190" y="168" width="60" height="11" rx="5" fill="#6CC5FF"/>
      <rect x="258" y="168" width="150" height="11" rx="5" fill="#C7D0DC"/>

      <rect x="190" y="196" width="180" height="11" rx="5" fill="#C7D0DC"/>
      <rect x="378" y="196" width="50" height="11" rx="5" fill="#FFB1A8"/>

      <rect x="208" y="224" width="90" height="11" rx="5" fill="#FFCB66"/>
      <rect x="306" y="224" width="110" height="11" rx="5" fill="#C7D0DC"/>

      <rect x="208" y="252" width="140" height="11" rx="5" fill="#9AD6A0"/>
      <rect x="190" y="280" width="70" height="11" rx="5" fill="#6CC5FF"/>
      <rect x="268" y="280" width="190" height="11" rx="5" fill="#C7D0DC"/>

      <rect x="190" y="308" width="120" height="11" rx="5" fill="#C7D0DC"/>
      <rect x="318" y="308" width="60" height="11" rx="5" fill="#FFB1A8"/>

      <rect x="172" y="336" width="80" height="11" rx="5" fill="#FFB1A8"/>
      <rect x="172" y="364" width="150" height="11" rx="5" fill="#C7D0DC"/>
      <rect x="330" y="364" width="80" height="11" rx="5" fill="#9AD6A0"/>

      <rect x="190" y="392" width="60" height="11" rx="5" fill="#6CC5FF"/>
      <rect x="258" y="392" width="120" height="11" rx="5" fill="#C7D0DC"/>

      <rect x="172" y="420" width="100" height="11" rx="5" fill="#FFB1A8"/>
      <rect x="172" y="448" width="60" height="11" rx="5" fill="#C7D0DC"/>
    </g>
  </g>

  <!-- floating phone preview -->
  <g filter="url(#ed-shadow)">
    <rect x="420" y="300" width="150" height="250" rx="22" fill="url(#ed-grad)"/>
    <rect x="432" y="324" width="126" height="214" rx="12" fill="#FFFFFF" fill-opacity="0.12"/>
    <rect x="448" y="346" width="60" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.9"/>
    <rect x="448" y="364" width="94" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.45"/>
    <rect x="448" y="378" width="80" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.45"/>
    <rect x="448" y="404" width="94" height="46" rx="8" fill="#FFFFFF" fill-opacity="0.2"/>
    <rect x="448" y="462" width="94" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.45"/>
    <rect x="448" y="476" width="70" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.45"/>
  </g>
</svg>
