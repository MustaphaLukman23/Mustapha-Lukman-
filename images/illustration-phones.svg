<svg width="560" height="600" viewBox="0 0 560 600" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two phones running Blogr">
  <defs>
    <linearGradient id="ph-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8F70"/>
      <stop offset="1" stop-color="#FF3D54"/>
    </linearGradient>
    <filter id="ph-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#10101B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- back phone -->
  <g filter="url(#ph-shadow)" transform="rotate(-6 300 320)">
    <rect x="250" y="120" width="180" height="360" rx="28" fill="#2B2F45"/>
    <rect x="262" y="150" width="156" height="300" rx="6" fill="url(#ph-grad)"/>
    <rect x="284" y="138" width="44" height="6" rx="3" fill="#1B1E2E"/>
    <g fill="#FFFFFF">
      <rect x="280" y="176" width="90" height="12" rx="6" fill-opacity="0.95"/>
      <rect x="280" y="198" width="120" height="7" rx="3.5" fill-opacity="0.5"/>
      <rect x="280" y="212" width="100" height="7" rx="3.5" fill-opacity="0.5"/>
      <rect x="280" y="240" width="120" height="70" rx="10" fill-opacity="0.18"/>
      <rect x="280" y="328" width="120" height="7" rx="3.5" fill-opacity="0.5"/>
      <rect x="280" y="342" width="90" height="7" rx="3.5" fill-opacity="0.5"/>
      <rect x="280" y="372" width="70" height="22" rx="11" fill-opacity="0.95"/>
    </g>
  </g>

  <!-- front phone -->
  <g filter="url(#ph-shadow)" transform="rotate(-6 220 300)">
    <rect x="120" y="170" width="180" height="360" rx="28" fill="#3A3F5C"/>
    <rect x="132" y="200" width="156" height="300" rx="6" fill="#FFFFFF"/>
    <rect x="154" y="188" width="44" height="6" rx="3" fill="#262A3C"/>
    <g>
      <rect x="150" y="226" width="90" height="12" rx="6" fill="#FF6F71"/>
      <rect x="150" y="248" width="120" height="7" rx="3.5" fill="#C7D0DC"/>
      <rect x="150" y="262" width="100" height="7" rx="3.5" fill="#C7D0DC"/>
      <rect x="150" y="290" width="120" height="70" rx="10" fill="#FFE3DF"/>
      <rect x="150" y="378" width="120" height="7" rx="3.5" fill="#C7D0DC"/>
      <rect x="150" y="392" width="90" height="7" rx="3.5" fill="#C7D0DC"/>
      <rect x="150" y="422" width="70" height="22" rx="11" fill="url(#ph-grad)"/>
    </g>
  </g>
</svg>
