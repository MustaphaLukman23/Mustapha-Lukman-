<svg width="650" height="600" viewBox="0 0 650 600" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Blogr running on a laptop">
  <defs>
    <linearGradient id="lp-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8F70"/>
      <stop offset="1" stop-color="#FF3D54"/>
    </linearGradient>
    <filter id="lp-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="30" stdDeviation="35" flood-color="#1F3F5C" flood-opacity="0.2"/>
    </filter>
  </defs>

  <g filter="url(#lp-shadow)">
    <!-- screen -->
    <rect x="150" y="90" width="420" height="280" rx="14" fill="#2B2F45"/>
    <rect x="166" y="106" width="388" height="248" rx="6" fill="#FFFFFF"/>

    <!-- screen content: app preview -->
    <rect x="166" y="106" width="388" height="40" rx="6" fill="#F4F6FB"/>
    <circle cx="186" cy="126" r="5" fill="#FF6F71"/>
    <circle cx="204" cy="126" r="5" fill="#FFC542"/>
    <circle cx="222" cy="126" r="5" fill="#3DD68C"/>

    <!-- hero card -->
    <rect x="186" y="166" width="160" height="170" rx="10" fill="url(#lp-grad)"/>
    <rect x="202" y="186" width="90" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.95"/>
    <rect x="202" y="206" width="120" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.5"/>
    <rect x="202" y="220" width="100" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.5"/>
    <rect x="202" y="246" width="70" height="22" rx="11" fill="#FFFFFF"/>
    <rect x="202" y="288" width="120" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.5"/>
    <rect x="202" y="302" width="90" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.5"/>

    <!-- right column text -->
    <g>
      <rect x="372" y="170" width="160" height="12" rx="6" fill="#1F3F5C"/>
      <rect x="372" y="194" width="160" height="7" rx="3.5" fill="#C7D0DC"/>
      <rect x="372" y="208" width="150" height="7" rx="3.5" fill="#C7D0DC"/>
      <rect x="372" y="222" width="158" height="7" rx="3.5" fill="#C7D0DC"/>
      <rect x="372" y="248" width="120" height="12" rx="6" fill="#1F3F5C"/>
      <rect x="372" y="272" width="160" height="7" rx="3.5" fill="#C7D0DC"/>
      <rect x="372" y="286" width="140" height="7" rx="3.5" fill="#C7D0DC"/>
      <rect x="372" y="300" width="155" height="7" rx="3.5" fill="#C7D0DC"/>
      <rect x="372" y="320" width="80" height="18" rx="9" fill="url(#lp-grad)"/>
    </g>

    <!-- base / keyboard deck -->
    <path d="M110 372h500l34 46c4 5 0 12-7 12H83c-7 0-11-7-7-12l34-46z" fill="#3A3F5C"/>
    <rect x="280" y="378" width="80" height="8" rx="4" fill="#2B2F45"/>
  </g>
</svg>
